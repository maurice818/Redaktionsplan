<h2>Passwort zurücksetzen</h2>
<p>Über den folgenden Link können Sie ein neues Passwort für die MEET GERMANY Redaktionszentrale festlegen:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/passwort-setzen">Neues Passwort festlegen</a></p>
<p>Falls Sie das nicht angefordert haben, ignorieren Sie diese E-Mail – Ihr Passwort bleibt unverändert.</p>
